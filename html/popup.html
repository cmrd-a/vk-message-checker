<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link type="text/css" rel="stylesheet" href="../css/popup.css" />
		<script src="../js/i18n.js" defer></script>
		<script src="../js/popup.js" defer></script>
	</head>
	<body>
		<div class="popup-container">
			<div class="header">
				<div class="header-title" id="openTitle" role="button" tabindex="0">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px;margin-right:6px;color:var(--accent)">
						<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
					</svg>
					<span data-i18n="appName">VK Messages</span>
					<span class="header-count" id="headerCount"></span>
				</div>
				<div class="header-actions">
					<div class="icon-btn" id="checkNow" data-i18n-title="checkNow" role="button" tabindex="0">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M21 12a9 9 0 1 1-2.64-6.36" />
							<path d="M21 4v5h-5" />
						</svg>
					</div>
					<div class="icon-btn" id="options" data-i18n-title="optionsTitle" role="button" tabindex="0">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<circle cx="12" cy="12" r="3" />
							<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
						</svg>
					</div>
				</div>
			</div>
			<div class="message-list" id="messageList">
				<div class="loading" data-i18n="loading">Loading...</div>
			</div>
			<div class="footer">
				<div class="footer-meta" id="lastChecked"></div>
				<div class="menu-item primary" id="open" role="button" tabindex="0">
					<span data-i18n="openApp">Open VK</span>
				</div>
			</div>
		</div>
	</body>
</html>
